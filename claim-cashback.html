<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Kit Cashback | apnaVeda™</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .claim-container {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
        }
        .claim-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .claim-header h2 {
            color: #1b5e20;
            margin-bottom: 8px;
        }
        .claim-header p {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus {
            border-color: #2e7d32;
        }
        .btn-claim {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-claim:hover {
            background: #1b5e20;
        }
        /* सक्सेस और कम्युनिटी बॉक्स */
        .success-box {
            display: none;
            text-align: center;
            padding: 20px 10px;
        }
        .success-box h3 {
            color: #2e7d32;
            margin-bottom: 10px;
        }
        .whatsapp-community-btn {
            display: inline-block;
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }
        .whatsapp-community-btn:hover {
            background: #1eb954;
        }
    </style>
</head>
<body style="background: #f8faf8; margin: 0; font-family: Arial, sans-serif;">

    <header class="navbar" style="background:#fff; padding: 15px 30px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee;">
        <div class="logo" style="font-weight:bold; font-size:20px; color:#1b5e20;">🌿 apnaVeda™</div>
        <a href="index.html" style="color:#2e7d32; text-decoration:none; font-weight:600;">← Back to Store</a>
    </header>

    <div class="claim-container">
        <div class="claim-header">
            <h2>Claim Kit Cashback</h2>
            <p>Enter your order details and coupon code found inside your Super Kit box.</p>
        </div>

        <form id="cashback-form" onsubmit="processCashback(event)">
            <div class="form-group">
                <label>Order Number</label>
                <input type="text" id="order-no" placeholder="e.g., AV-2026-101" required>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="cust-name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="tel" id="cust-phone" placeholder="10-digit WhatsApp number" maxlength="10" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="cust-email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Secret Coupon Code</label>
                <input type="text" id="coupon-code" placeholder="e.g., VEDA30" style="text-transform: uppercase;" required>
            </div>
            <div class="form-group">
                <label>Your UPI ID (For Direct Cashback)</label>
                <input type="text" id="cust-upi" placeholder="e.g., 6386862362@upi or name@okaxis" required>
            </div>
            <button type="submit" class="btn-claim">Verify & Claim Cashback</button>
        </form>

        <!-- सफलता और कम्युनिटी का बॉक्स -->
        <div id="success-box" class="success-box">
            <h3>✓ Claim Request Submitted!</h3>
            <p id="claim-detail-msg" style="font-size: 14px; color: #444; line-height: 1.6;"></p>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            <p style="font-weight: 600; color: #1b5e20; margin-bottom: 5px;">Join Our VIP Wellness Community</p>
            <p style="font-size: 12px; color: #666;">Get exclusive diet tips, early discounts, and free health consultation:</p>
            
            <!-- यहाँ अपना असली व्हाट्सएप कम्युनिटी लिंक जोड़ें -->
            <a href="https://chat.whatsapp.com/YOUR_COMMUNITY_LINK" target="_blank" class="whatsapp-community-btn">
                💬 Join VIP WhatsApp Community
            </a>
        </div>
    </div>

    <script>
        function processCashback(e) {
            e.preventDefault();

            const orderNo = document.getElementById('order-no').value.trim().toUpperCase();
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const email = document.getElementById('cust-email').value.trim();
            const coupon = document.getElementById('coupon-code').value.trim().toUpperCase();
            const upi = document.getElementById('cust-upi').value.trim();

            // 1. चेक करें कि क्या यह कूपन पहले यूज़ हो चुका है
            let usedCoupons = JSON.parse(localStorage.getItem('apnaVeda_used_coupons') || '[]');
            if (usedCoupons.includes(coupon)) {
                alert('Error: This coupon code has ALREADY been claimed! Every coupon is strictly valid for single use.');
                return;
            }

            // 2. रिकॉर्ड तैयार करना (7 दिन की वेरिफिकेशन तिथि)
            const claimDate = new Date();
            const claimRecord = {
                orderNo: orderNo,
                name: name,
                phone: phone,
                email: email,
                coupon: coupon,
                upi: upi,
                amount: 30, // ₹30 का कैशबैक
                status: "Pending (7-Day Return Verification)",
                claimDate: claimDate.toISOString().split('T')[0]
            };

            // 3. डेटा सुरक्षित स्टोर करना (एडमिन पैनल के लिए)
            let allClaims = JSON.parse(localStorage.getItem('apnaVeda_cashback_records') || '[]');
            allClaims.push(claimRecord);
            localStorage.setItem('apnaVeda_cashback_records', JSON.stringify(allClaims));

            // कूपन को यूज़्ड लिस्ट में लॉक कर देना
            usedCoupons.push(coupon);
            localStorage.setItem('apnaVeda_used_coupons', JSON.stringify(usedCoupons));

            // 4. फॉर्म छिपाना और कम्युनिटी बॉक्स दिखाना
            document.getElementById('cashback-form').style.display = 'none';
            const successBox = document.getElementById('success-box');
            document.getElementById('claim-detail-msg').innerHTML = 
                `Hello <strong>${name}</strong>, your claim for coupon <strong>${coupon}</strong> has been logged.<br>` +
                `Cashback of <strong>₹30</strong> will be transferred to UPI (<strong>${upi}</strong>) within 24 hours after the standard 7-day return period is completed.`;
            successBox.style.display = 'block';
        }
    </script>
</body>
</html>
