<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account & Orders | apnaVeda™</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f8faf8; font-family: Arial, sans-serif; margin: 0; color: #333; }
        .account-header {
            background: #1b5e20;
            color: #ffffff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .account-header h1 { font-size: 20px; margin: 0; }
        .account-header a { color: #ffeb3b; text-decoration: none; font-size: 14px; font-weight: bold; }
        
        .account-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .search-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            text-align: center;
        }
        .search-box h2 { font-size: 18px; color: #1b5e20; margin-bottom: 12px; }
        .search-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        .search-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        .search-group button {
            background: #2e7d32;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .order-card {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .order-card-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .order-id-tag { font-weight: bold; color: #1b5e20; }

        .tracking-bar {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 25px 0;
            padding: 0 10px;
        }
        .step { text-align: center; font-size: 12px; color: #777; }
        .step.active { color: #1b5e20; font-weight: bold; }
        .step-circle {
            width: 28px;
            height: 28px;
            background: #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 6px auto;
            color: #ffffff;
            font-size: 12px;
        }
        .step.active .step-circle { background: #2e7d32; }

        .order-details-box {
            background: #fdfdfd;
            border: 1px solid #f0f0f0;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .order-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn-cancel {
            background: #ffffff;
            border: 1px solid #d32f2f;
            color: #d32f2f;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-cancel:hover { background: #d32f2f; color: #ffffff; }
        .btn-return {
            background: #ffffff;
            border: 1px solid #e65100;
            color: #e65100;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-return:hover { background: #e65100; color: #ffffff; }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-confirmed { background: #e8f5e9; color: #2e7d32; }
        .badge-cancelled { background: #ffebee; color: #c62828; }
        .badge-return { background: #fff3e0; color: #ef6c00; }
    </style>
</head>
<body>

    <header class="account-header">
        <h1>🌿 apnaVeda™ Customer Dashboard</h1>
        <a href="index.html">← Back to Store</a>
    </header>

    <div class="account-container">

        <!-- सर्च बार -->
        <div class="search-box">
            <h2>Track &amp; Manage Your Orders</h2>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Enter your registered 10-digit mobile number or Order ID</p>
            <div class="search-group">
                <input type="text" id="lookup-query" placeholder="Mobile Number or Order ID (e.g. 6386862362)">
                <button onclick="findCustomerOrders()">Search Order</button>
            </div>
        </div>

        <!-- ऑर्डर्स रेंडर एरिया -->
        <div id="orders-display-area"></div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const savedPhone = sessionStorage.getItem("apnaVeda_customer_phone");
            if (savedPhone) {
                document.getElementById("lookup-query").value = savedPhone;
                findCustomerOrders();
            }
        });

        function findCustomerOrders() {
            const query = document.getElementById("lookup-query").value.trim().toLowerCase();
            const container = document.getElementById("orders-display-area");

            if (!query) {
                alert("Please enter your registered mobile number or Order ID");
                return;
            }

            const allOrders = JSON.parse(localStorage.getItem("apnaVeda_orders") || "[]");
            const matchingOrders = allOrders.filter(o => 
                (o.phone && o.phone.toLowerCase().includes(query)) || 
                (o.orderId && o.orderId.toLowerCase() === query)
            );

            if (matchingOrders.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; background: #ffffff; border-radius: 8px; border: 1px solid #eee;">
                        <p style="font-size: 16px; color: #888;">No orders found matching: <strong>${query}</strong></p>
                        <small>Please verify your phone number or place an order from the store.</small>
                    </div>
                `;
                return;
            }

            container.innerHTML = "";
            matchingOrders.reverse().forEach((order) => {
                const currentStatus = order.status || "Order Confirmed";
                const isCancelled = currentStatus === "Cancelled";
                const isReturnRequested = currentStatus === "Return Requested";

                let itemsList = (order.items || []).map(i => `${i.name} × ${i.quantity || 1} (₹${i.price * (i.quantity || 1)})`).join("<br>");

                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-card-header">
                            <div>
                                <span class="order-id-tag">Order ID: ${order.orderId}</span><br>
                                <small style="color: #666;">Date: ${order.orderDate || 'Recent'} | Mode: ${order.paymentMethod}</small>
                            </div>
                            <div>
                                <span class="badge ${isCancelled ? 'badge-cancelled' : (isReturnRequested ? 'badge-return' : 'badge-confirmed')}">
                                    ${currentStatus}
                                </span>
                            </div>
                        </div>

                        ${!isCancelled ? `
                        <div class="tracking-bar">
                            <div class="step active"><div class="step-circle">✓</div>Confirmed</div>
                            <div class="step ${['Shipped', 'Out for Delivery', 'Delivered'].includes(currentStatus) ? 'active' : ''}"><div class="step-circle">🚚</div>Shipped</div>
                            <div class="step ${['Out for Delivery', 'Delivered'].includes(currentStatus) ? 'active' : ''}"><div class="step-circle">📦</div>Out for Delivery</div>
                            <div class="step ${currentStatus === 'Delivered' ? 'active' : ''}"><div class="step-circle">🏠</div>Delivered</div>
                        </div>
                        ` : '<div style="color: #d32f2f; font-weight: bold; margin: 15px 0;">This order has been cancelled.</div>'}

                        <div class="order-details-box">
                            <strong>Ordered Items:</strong><br>${itemsList}<br><br>
                            <strong>Delivery Address:</strong> ${order.name}, ${order.address}, ${order.city}, ${order.state} - ${order.pincode} (Ph: ${order.phone})
                        </div>

                        <div class="order-actions">
                            ${!isCancelled && currentStatus !== 'Delivered' ? `
                                <button class="btn-cancel" onclick="cancelOrder('${order.orderId}')">Cancel Order</button>
                            ` : ''}

                            ${currentStatus === 'Delivered' && !isReturnRequested ? `
                                <button class="btn-return" onclick="requestReturn('${order.orderId}')">Request 7-Day Return</button>
                            ` : ''}

                            <a href="https://wa.me/916386862362?text=Hello%20apnaVeda,%20I%20have%20an%20inquiry%20regarding%20Order%20${order.orderId}" target="_blank" style="text-decoration:none; padding:8px 14px; background:#25D366; color:white; border-radius:4px; font-size:13px; font-weight:bold;">Chat on WhatsApp</a>
                        </div>
                    </div>
                `;
            });
        }

        function cancelOrder(orderId) {
            if (confirm("Are you sure you want to cancel this order?")) {
                updateOrderStatus(orderId, "Cancelled");
                alert("Order " + orderId + " has been cancelled.");
                findCustomerOrders();
            }
        }

        function requestReturn(orderId) {
            const reason = prompt("Please provide reason for 7-day return request (e.g. damaged seal, wrong item):");
            if (reason) {
                updateOrderStatus(orderId, "Return Requested");
                alert("Return request submitted for Order " + orderId + ". Our support team will contact you via WhatsApp.");
                findCustomerOrders();
            }
        }

        function updateOrderStatus(orderId, newStatus) {
            let allOrders = JSON.parse(localStorage.getItem("apnaVeda_orders") || "[]");
            allOrders = allOrders.map(o => {
                if (o.orderId === orderId) {
                    o.status = newStatus;
                }
                return o;
            });
            localStorage.setItem("apnaVeda_orders", JSON.stringify(allOrders));
        }
    </script>
</body>
</html>
